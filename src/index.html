<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src https: data:; media-src https: blob: data: http://127.0.0.1:*; connect-src https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>YouTube Desktop</title>
<link rel="stylesheet" href="styles.css">
<style id="custom-css"></style>
<style id="cue-css"></style>
</head>
<body>
<header id="top">
  <button id="menu-btn" title="Menu"><i data-ic="menu"></i></button>
  <div id="nav-btns"><button id="nav-back" title="Back (Alt+Left)" disabled><i data-ic="chevleft"></i></button><button id="nav-fwd" title="Forward (Alt+Right)" disabled><i data-ic="chevright"></i></button></div>
  <div id="logo" title="Home"><span class="logo-mark">▶</span><span class="logo-text">You<span class="tube">Tube</span></span></div>
  <div id="search-wrap">
    <input id="search" placeholder="Search" autocomplete="off" spellcheck="true">
    <button id="search-btn" title="Search"><i data-ic="search"></i></button>
    <ul id="suggest" hidden></ul>
  </div>
  <button id="perf-chip" hidden></button>
  <button id="bell-btn" title="Notifications" aria-label="Notifications"><i data-ic="bell"></i><span id="bell-badge" hidden></span></button>
  <button id="acct-btn" title="Sign in"><i data-ic="user"></i></button>
  <button id="settings-btn" title="Settings"><i data-ic="sliders"></i></button>
</header>
<div id="tabbar" hidden></div>
<div id="layout">
  <nav id="side">
    <a data-nav="home" class="active"><i data-ic="home"></i><span>Home</span></a>
    <a data-nav="subs"><i data-ic="subs"></i><span>Subscriptions</span></a>
    <a data-nav="playlists"><i data-ic="list"></i><span>Playlists</span></a>
    <a data-nav="history"><i data-ic="history"></i><span>History</span></a>
    <a data-nav="watchlater"><i data-ic="clock"></i><span>Watch later</span></a>
    <a data-nav="downloads"><i data-ic="download"></i><span>Downloads</span></a>
    <div id="side-subs" hidden></div>
  </nav>
  <div id="side-resizer" title="Drag to resize"></div>
  <main id="main"><div id="filters" hidden></div><div id="subbox" hidden></div><div id="chan" hidden></div><div id="grid"></div><div id="status"></div></main>
  <section id="watch" hidden>
    <div id="player-area">
      <div id="player-box">
        <video id="video" crossorigin="anonymous" preload="auto" playsinline></video>
        <div id="sb-toast" hidden></div>
        <div id="mini-ui">
          <div class="mini-top"><span id="mini-title"></span><button id="mini-expand" title="Back to the video" aria-label="Back to the video"><i data-ic="fs"></i></button><button id="mini-close" title="Close the player" aria-label="Close the player"><i data-ic="x"></i></button></div>
          <div id="mini-ask" hidden><b>Close the player?</b><span><button data-a="yes">Close</button><button data-a="no">Keep playing</button></span></div>
          <button id="mini-play" title="Play / pause" aria-label="Play or pause"></button>
          <button id="mini-next" title="Next video" aria-label="Next video"><i data-ic="next"></i></button>
          <div id="mini-bar"><div id="mini-fill"></div></div>
        </div>
        <button id="p-bigplay" aria-label="Play or pause"></button>
        <div id="p-skip" hidden></div>
        <div id="pbar">
          <div id="pseek"><div class="pt"><div class="pbuf"></div><div class="pplay"></div><div class="pmarks"></div></div><div class="pknob"></div><div id="ptip" hidden></div></div>
          <div class="prow">
            <button id="pc-play" class="pc" title="Play / pause (K)" tabindex="-1"></button>
            <div class="pvol"><button id="pc-mute" class="pc" title="Mute (M)" tabindex="-1"></button><input id="pc-vol" type="range" min="0" max="1" step="0.02" tabindex="-1"></div>
            <div id="p-quick"></div>
            <span id="pc-time"></span>
            <button id="pc-chap" class="pc-chap" title="Chapters" tabindex="-1" hidden></button>
            <span class="grow"></span>
            <button id="pc-auto" class="pc" title="Autoplay" tabindex="-1"><span class="sw"><span class="kn"></span></span></button>
            <button id="p-gear" class="p-gear" title="More: actions, quality, speed, subtitles" tabindex="-1"><i data-ic="dots"></i></button>
            <button id="pc-fs" class="pc" title="Full screen (F)" tabindex="-1"></button>
          </div>
        </div>
        <div id="p-menu" class="p-menu" hidden></div>
        <div id="end-screen" hidden></div>
      </div>
      <div id="toolbar-wrap">
        <div id="player-tools"></div>
        <div id="toolbar-ctl"></div>
        <ul id="tool-menu" hidden></ul>
      </div>
    </div>
    <div id="details">
      <h1 id="w-title"></h1>
      <div id="w-channel-row">
        <img id="w-avatar" alt="">
        <div id="w-channel-text"><a id="w-ch"></a><span id="w-subs"></span></div>
        <button id="w-sub">Subscribe</button>
        <button id="w-bell" class="pillbtn" title="Notifications for this channel"><i data-ic="bell"></i></button>
        <span class="grow"></span>
        <span id="rate" class="chip"><button id="r-like" title="Like"><i data-ic="up"></i><span id="r-likes"></span></button><button id="r-dislike" title="Dislike"><i data-ic="down"></i><span id="r-dislikes"></span></button></span>
        <button id="w-share" class="pillbtn" title="Share"><i data-ic="share"></i><span class="lb">Share</span></button>
        <button id="w-save" class="pillbtn" title="Save"><i data-ic="bookmark"></i><span class="lb">Save</span></button>
        <button id="w-dl" class="pillbtn" title="Download"><i data-ic="download"></i><span class="lb">Download</span></button>
        <button id="w-more" class="pillbtn" title="More"><i data-ic="dots"></i></button>
      </div>
      <div id="w-chapters" class="box" hidden></div>
      <div id="w-desc" class="box collapsed">
        <div id="w-stats"></div>
        <div id="w-desc-text"></div>
        <button id="desc-toggle" class="link">Show more</button>
      </div>
      <section id="comments-box" class="box">
        <header>
          <h3 id="c-title">Comments</h3>
          <label class="c-find" title="Search the comments loaded so far"><i data-ic="search"></i><input id="c-find" placeholder="Search comments" spellcheck="false"></label>
          <select id="c-sort" title="Sort comments"><option value="TOP_COMMENTS">Top</option><option value="NEWEST_FIRST">Newest</option></select>
          <button id="c-place" class="link" title="Move the comments to the side, or back below the video"></button>
          <button id="c-toggle" class="link">Hide</button>
        </header>
        <div id="c-compose"></div>
        <div id="c-note"></div>
        <div id="c-list"></div>
        <div id="c-more"></div>
      </section>
    </div>
    <aside id="right-col">
      <div id="side-comments"></div>
      <section id="rc-panel" class="rc-panel" hidden>
        <header><h3>In this video</h3><button id="rc-x" title="Hide this panel" class="rc-x"><i data-ic="x"></i></button></header>
        <div class="rc-tabs"><button data-tab="chapters">Chapters</button><button data-tab="transcript">Transcript</button></div>
        <div id="rc-body"></div>
      </section>
      <div id="rc-chips"></div>
      <div id="related"></div>
    </aside>
  </section>
</div>
<div id="update-bar" hidden></div>
<div id="notif-panel" hidden></div>
<div id="gtoast" hidden></div>
<div id="acct-menu" class="popover" hidden></div>
<div id="login" class="overlay" hidden>
  <div class="panel">
    <h2>Sign in to YouTube</h2>
    <div id="login-body"></div>
    <button id="login-cancel">Cancel</button>
  </div>
</div>
<div id="settings" hidden>
  <div class="panel wide">
    <header class="s-head"><h2>Settings</h2><button id="s-close" title="Close">✕</button></header>
    <div class="s-body"><nav id="s-tabs"></nav><div id="s-pane"></div></div>
  </div>
</div>
<script src="icons.js"></script>
<script src="settings-schema.js"></script>
<script src="app.js"></script>
</body>
</html>
