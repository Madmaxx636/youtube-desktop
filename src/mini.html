<!doctype html><html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src https: blob:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>html,body{margin:0;height:100%;background:#000;-webkit-app-region:drag;overflow:hidden}
video{width:100%;height:100%;-webkit-app-region:no-drag}
#bar{position:fixed;top:0;left:0;right:0;height:30px;display:flex;justify-content:flex-end;gap:6px;padding:4px 6px;background:linear-gradient(rgba(0,0,0,.7),transparent);opacity:0;transition:opacity .15s;z-index:5;-webkit-app-region:drag}
body:hover #bar{opacity:1}
#bar button{-webkit-app-region:no-drag;background:rgba(40,40,40,.85);color:#fff;border:0;border-radius:4px;width:26px;height:22px;cursor:pointer;font-size:13px}
#bar button:hover{background:#c00}</style></head>
<body><div id="bar"><button id="back" title="Back to the app">⤢</button></div><video id="v" controls autoplay></video>
<script>
const v = document.getElementById('v');
const a = new Audio();
let hasAudio = false;
window.api.onMiniState((s) => {
  if (!s.src || v.dataset.src === s.src) return;
  v.dataset.src = s.src;
  v.src = s.src;
  hasAudio = !!s.audio;
  if (hasAudio) a.src = s.audio;
  v.addEventListener('loadedmetadata', () => { v.currentTime = s.time || 0; sync(true); v.play(); }, { once: true });
});
function sync(hard) {
  if (!hasAudio) return;
  a.playbackRate = v.playbackRate; a.volume = v.volume; a.muted = v.muted;
  if (hard || Math.abs(a.currentTime - v.currentTime) > 0.25) a.currentTime = v.currentTime;
}
for (const ev of ['play', 'playing']) v.addEventListener(ev, () => { sync(true); if (hasAudio) a.play().catch(() => {}); });
for (const ev of ['pause', 'waiting']) v.addEventListener(ev, () => hasAudio && a.pause());
for (const ev of ['seeked']) v.addEventListener(ev, () => sync(true));
for (const ev of ['ratechange', 'volumechange']) v.addEventListener(ev, () => sync(false));
document.getElementById('back').onclick = () => window.close();
window.api.miniCmd('mini-ready');
setInterval(() => { sync(false); window.api.miniCmd('mini-time:' + v.currentTime); }, 1000);
</script></body></html>
